<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallballs Session Analysis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(17, 24, 39, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-color: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-cyan: #06b6d4;
      --accent-red: #ef4444;
      --accent-purple: #8b5cf6;
    }

    body {
      margin: 0;
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px 40px;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 600;
      background: linear-gradient(to right, #22d3ee, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .container {
      flex: 1;
      padding: 30px 40px;
      max-width: 1400px;
      margin: 0 auto;
      width: calc(100% - 80px);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .controls-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      backdrop-filter: blur(10px);
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 500;
    }

    .clean-select, .number-input {
      background: #1e293b;
      border: 1px solid var(--card-border);
      color: var(--text-color);
      padding: 8px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .clean-select:focus, .number-input:focus {
      border-color: var(--accent-cyan);
    }

    .number-input {
      width: 80px;
    }

    /* Hide HTML5 number spinner arrows */
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }

    .chart-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      backdrop-filter: blur(10px);
    }

    .chart-header {
      margin-bottom: 12px;
      border-left: 3px solid var(--accent-cyan);
      padding-left: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chart-header.hr {
      border-left-color: var(--accent-red);
    }

    .chart-title {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--text-color);
    }

    .plot-box {
      width: 100%;
      height: 300px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Wallballs Session Analysis</h1>
  </header>

  <div class="container">
    <!-- Signal & Filtering Controls -->
    <div class="controls-card">
      <div class="control-group">
        <span class="control-label">Signal</span>
        <select id="wb-signal" class="clean-select">
          <option value="x">ACC X</option>
          <option value="y">ACC Y</option>
          <option value="z">ACC Z</option>
          <option value="mag" selected>Magnitude</option>
        </select>
      </div>
      <div class="control-group">
        <span class="control-label">Cleaning</span>
        <select id="wb-clean" class="clean-select">
          <option value="raw">Raw</option>
          <option value="iqr" selected>IQR (N=3.0)</option>
        </select>
      </div>
      <div class="control-group">
        <span class="control-label">Low Cut</span>
        <div style="display: flex; align-items: center; gap: 6px;">
          <input type="number" id="wb-low-cut" class="number-input" min="0" max="50" step="0.1" value="0">
          <span style="font-size: 0.9rem; color: var(--text-muted);">Hz</span>
        </div>
      </div>
      <div class="control-group">
        <span class="control-label">High Cut</span>
        <div style="display: flex; align-items: center; gap: 6px;">
          <input type="number" id="wb-high-cut" class="number-input" min="0" max="50" step="0.1" value="4.0">
          <span style="font-size: 0.9rem; color: var(--text-muted);">Hz</span>
        </div>
      </div>
    </div>

    <!-- Hierarchical Segmentation Controls -->
    <div class="controls-card">
      <div class="control-group">
        <span class="control-label">Seg Method</span>
        <select id="wb-seg-method" class="clean-select">
          <option value="none">None</option>
          <option value="peaks" selected>By Peaks</option>
        </select>
      </div>
      <div class="control-group" id="wb-seg-mode-group" style="display: flex;">
        <span class="control-label">Seg Mode</span>
        <select id="wb-seg-mode" class="clean-select">
          <option value="prominence">Standard Deviation</option>
          <option value="distance" selected>Dominant Frequency</option>
        </select>
      </div>
      <div class="control-group" id="wb-hr-freq-group" style="display: flex;">
        <span class="control-label">HR Dom Freq</span>
        <div style="display: flex; align-items: center; gap: 6px;">
          <input type="number" id="wb-hr-freq" class="number-input" min="0.001" max="1.0" step="0.001" style="width: 70px;">
          <span style="font-size: 0.9rem; color: var(--text-muted);">Hz</span>
        </div>
      </div>
    </div>

    <!-- Time Domain Chart -->
    <div class="chart-card">
      <div class="chart-header">
        <span class="chart-title">Time Domain</span>
      </div>
      <div id="wb-time-plot" class="plot-box"></div>
    </div>

    <!-- HR Chart -->
    <div class="chart-card">
      <div class="chart-header hr">
        <span class="chart-title">Heart Rate</span>
      </div>
      <div id="wb-hr-plot" class="plot-box"></div>
    </div>

    <!-- Spectrogram Chart -->
    <div class="chart-card">
      <div class="chart-header">
        <span class="chart-title" id="wb-spec-title">Spectrogram</span>
      </div>
      <div id="wb-spec-plot" class="plot-box"></div>
    </div>

    <!-- Spectrogram Controls -->
    <div class="controls-card">
      <div class="control-group">
        <span class="control-label">Min Power</span>
        <div style="display: flex; align-items: center; gap: 8px;">
          <input type="range" id="wb-spec-min-slider" min="0" max="1.0" step="0.001" value="0.0" style="width: 100px; accent-color: var(--accent-cyan);">
          <input type="number" id="wb-spec-min" class="number-input" min="0" max="10" step="0.001" value="0.0" style="width: 70px;">
        </div>
      </div>
      <div class="control-group">
        <span class="control-label">Max Power</span>
        <div style="display: flex; align-items: center; gap: 8px;">
          <input type="range" id="wb-spec-max-slider" min="0.001" max="1.0" step="0.001" value="0.5" style="width: 100px; accent-color: var(--accent-cyan);">
          <input type="number" id="wb-spec-max" class="number-input" min="0.001" max="10" step="0.001" value="0.5" style="width: 70px;">
        </div>
      </div>
    </div>
  </div>

  <script src="/fft_lib.js"></script>
  <script src="/wallballs/heart_rat.js"></script>
  <script src="/wallballs/time_domain.js"></script>
  <script src="/wallballs/spectrogram.js"></script>
  <script>
    // Global State
    const state = {
      signal: 'mag',
      clean: 'iqr',
      lowCut: 0,
      highCut: 4.0,
      segMethod: 'peaks',
      segMode: 'distance',
      hrFreq: null,
      specMin: 0.0,
      specMax: 0.5,
      lastSignal: null,
      data: null
    };

    const PLOTLY_CFG = {
      responsive: true,
      displayModeBar: true,
      modeBarButtonsToRemove: ['select2d', 'lasso2d'],
      displaylogo: false
    };

    const baseLayout = (titleY) => ({
      uirevision: true,
      paper_bgcolor: 'transparent',
      plot_bgcolor: 'transparent',
      margin: { l: 60, r: 20, t: 10, b: 40 },
      font: { family: 'Outfit, sans-serif', color: '#9ca3af', size: 11 },
      xaxis: {
        title: { text: 'Time (s)', standoff: 6 },
        gridcolor: 'rgba(255,255,255,0.04)',
        zerolinecolor: 'rgba(255,255,255,0.08)'
      },
      yaxis: {
        title: { text: titleY, standoff: 6 },
        gridcolor: 'rgba(255,255,255,0.04)',
        zerolinecolor: 'rgba(255,255,255,0.08)'
      },
      showlegend: true,
      legend: {
        x: 0.01,
        y: 0.99,
        xanchor: 'left',
        yanchor: 'top',
        bgcolor: 'rgba(0,0,0,0)',
        orientation: 'h',
        font: { size: 10 }
      }
    });

    let etag = null;
    let inited = false;

    async function fetchData() {
      try {
        const headers = {};
        if (etag) {
          headers['If-None-Match'] = etag;
        }
        const url = `/data/wallballs?clean=${state.clean}&seg_method=${state.segMethod}&seg_mode=${state.segMode}` + 
                    (state.hrFreq ? `&hr_freq=${state.hrFreq}` : '');
        const res = await fetch(url, { headers });
        if (res.status === 304) {
          return;
        }
        if (!res.ok) return;
        etag = res.headers.get('ETag');
        state.data = await res.json();

        // Show / Hide custom frequency group based on segMode
        const freqGroup = document.getElementById('wb-hr-freq-group');
        if (state.segMethod === 'peaks' && state.segMode === 'distance') {
          freqGroup.style.display = 'flex';
          if (state.hrFreq === null && state.data.hr_dom_freq) {
            document.getElementById('wb-hr-freq').value = state.data.hr_dom_freq.toFixed(3);
          }
        } else {
          freqGroup.style.display = 'none';
        }

        renderCharts();
        if (!inited) {
          setupSync(['wb-time-plot', 'wb-hr-plot', 'wb-spec-plot']);
          inited = true;
        }
      } catch (err) {
        console.error('Fetch error:', err);
      }
    }

    function setupSync(ids) {
      let syncing = false;
      ids.forEach(srcId => {
        const el = document.getElementById(srcId);
        if (!el) return;
        el.on("plotly_relayout", ev => {
          if (syncing) return;
          syncing = true;
          let update = null;
          if (ev["xaxis.autorange"]) {
            update = { "xaxis.autorange": true };
          } else if (ev["xaxis.range[0]"] !== undefined) {
            update = { "xaxis.range": [ev["xaxis.range[0]"], ev["xaxis.range[1]"]] };
          } else if (ev["xaxis.range"]) {
            update = { "xaxis.range": [ev["xaxis.range"][0], ev["xaxis.range"][1]] };
          }
          if (update) {
            ids.forEach(tgtId => {
              if (tgtId !== srcId) {
                const tgtEl = document.getElementById(tgtId);
                if (tgtEl && tgtEl._fullLayout) {
                  const tgtXa = tgtEl._fullLayout.xaxis;
                  if (update["xaxis.autorange"] && tgtXa.autorange === true) return;
                  if (update["xaxis.range"]) {
                    const r = update["xaxis.range"];
                    if (tgtXa.autorange === false && tgtXa.range &&
                        Math.abs(tgtXa.range[0] - r[0]) < 1e-4 &&
                        Math.abs(tgtXa.range[1] - r[1]) < 1e-4) {
                      return;
                    }
                  }
                  Plotly.relayout(tgtId, update);
                }
              }
            });
          }
          syncing = false;
        });
      });
    }

    function renderCharts() {
      if (!state.data) return;
      renderHeartRate(state.data);
      renderTimeDomain(state.data, state);
      renderSpectrogram(state.data, state);
    }

    // Event Listeners
    document.getElementById('wb-signal').addEventListener('change', e => {
      state.signal = e.target.value;
      renderCharts();
    });

    document.getElementById('wb-clean').addEventListener('change', e => {
      state.clean = e.target.value;
      fetchData();
    });

    document.getElementById('wb-low-cut').addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        state.lowCut = parseFloat(e.target.value) || 0;
        renderCharts();
      }
    });

    document.getElementById('wb-high-cut').addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        state.highCut = parseFloat(e.target.value) || 0;
        renderCharts();
      }
    });

    document.getElementById('wb-seg-method').addEventListener('change', e => {
      state.segMethod = e.target.value;
      const modeGroup = document.getElementById('wb-seg-mode-group');
      if (state.segMethod === 'peaks') {
        modeGroup.style.display = 'flex';
        document.getElementById('wb-seg-mode').value = 'distance';
        state.segMode = 'distance';
      } else {
        modeGroup.style.display = 'none';
      }
      state.hrFreq = null; // Reset to auto
      fetchData();
    });

    document.getElementById('wb-seg-mode').addEventListener('change', e => {
      state.segMode = e.target.value;
      state.hrFreq = null; // Reset to auto
      fetchData();
    });

    document.getElementById('wb-hr-freq').addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const val = parseFloat(e.target.value);
        state.hrFreq = (!isNaN(val) && val > 0) ? val : null;
        fetchData();
      }
    });

    document.getElementById('wb-spec-min').addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const val = parseFloat(e.target.value) || 0;
        state.specMin = val;
        document.getElementById('wb-spec-min-slider').value = val;
        renderCharts();
      }
    });

    document.getElementById('wb-spec-min-slider').addEventListener('input', e => {
      const val = parseFloat(e.target.value);
      state.specMin = val;
      document.getElementById('wb-spec-min').value = val.toFixed(3);
      renderCharts();
    });

    document.getElementById('wb-spec-max').addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const val = parseFloat(e.target.value) || 0.5;
        state.specMax = val;
        document.getElementById('wb-spec-max-slider').value = val;
        renderCharts();
      }
    });

    document.getElementById('wb-spec-max-slider').addEventListener('input', e => {
      const val = parseFloat(e.target.value);
      state.specMax = val;
      document.getElementById('wb-spec-max').value = val.toFixed(3);
      renderCharts();
    });

    // Initial Load & Poll
    fetchData();
    setInterval(fetchData, 3000);
  </script>
</body>
</html>
