<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WebXR Plane Detection (three.js)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  body { margin:0; overflow:hidden; background:#000; color:#fff; font-family:sans-serif; }
  #info {
    position:absolute; top:10px; width:100%; text-align:center;
    font-size:14px; z-index:1; pointer-events:none;
  }
</style>
</head>
<body>
<div id="info">WebXR Plane Detection — requires Chrome/Edge on an ARCore-capable Android device</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { ARButton } from 'three/addons/webxr/ARButton.js';

let camera, scene, renderer;
const planes = new Map(); // XRPlane -> THREE.Mesh

init();

function init() {
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

  const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
  light.position.set(0.5, 1, 0.25);
  scene.add(light);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  document.body.appendChild(
    ARButton.createButton(renderer, {
      requiredFeatures: ['plane-detection']
    })
  );

  window.addEventListener('resize', onWindowResize);

  renderer.setAnimationLoop(render);
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function buildPlaneMesh(pose, polygon) {
  const shape = new THREE.Shape();
  polygon.forEach((p, i) => {
    if (i === 0) shape.moveTo(p.x, p.z);
    else shape.lineTo(p.x, p.z);
  });

  const geometry = new THREE.ShapeGeometry(shape);
  geometry.rotateX(Math.PI / 2);

  const material = new THREE.MeshBasicMaterial({
    color: 0x00ffff,
    opacity: 0.35,
    transparent: true,
    side: THREE.DoubleSide,
    wireframe: false
  });

  const mesh = new THREE.Mesh(geometry, material);
  mesh.matrixAutoUpdate = false;
  return mesh;
}

function render(timestamp, frame) {
  if (frame) {
    const referenceSpace = renderer.xr.getReferenceSpace();
    const session = renderer.xr.getSession();

    if (session.enabledFeatures && session.enabledFeatures.includes('plane-detection') && frame.detectedPlanes) {
      // Remove meshes for planes no longer detected
      for (const [xrPlane, mesh] of planes) {
        if (!frame.detectedPlanes.has(xrPlane)) {
          scene.remove(mesh);
          planes.delete(xrPlane);
        }
      }

      // Add or update meshes for currently detected planes
      frame.detectedPlanes.forEach((xrPlane) => {
        const pose = frame.getPose(xrPlane.planeSpace, referenceSpace);
        if (!pose) return;

        if (planes.has(xrPlane)) {
          const mesh = planes.get(xrPlane);
          mesh.matrix.fromArray(pose.transform.matrix);
        } else {
          const mesh = buildPlaneMesh(pose, xrPlane.polygon);
          mesh.matrix.fromArray(pose.transform.matrix);
          scene.add(mesh);
          planes.set(xrPlane, mesh);
        }
      });
    }
  }

  renderer.render(scene, camera);
}
</script>
</body>
</html>
