<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!--
  Base reference: Concept2 PM5 BLE example
  https://bandarra.me/posts/Fitness-Tracking-with-Web-Bluetooth
  https://github.com/GoogleChromeLabs/rowing-monitor
  https://www.concept2.co.uk/files/pdf/us/monitors/PM5_BluetoothSmartInterfaceDefinition.pdf
  https://github.com/paschmann/concept2_rower
  https://github.com/tijmenvangulik/ErgometerJS

  Polar devices (H9, H10, OH1, Verity Sense) do not use a proprietary
  service like the PM5. They implement the standard Bluetooth SIG
  Heart Rate Service (0x180D) and Heart Rate Measurement characteristic
  (0x2A37), same as Amazfit's Heart Rate Push feature.
  -->

  <title>Connect to Concept2 PM5 + Polar HR</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .statusIndicator {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background-color: red;
      display: inline-block;
    }
  </style>
</head>
<body>
  <h2>Concept2 PM5 BLE Connection</h2>
  <div class="row">
    <button onclick="connectToPM5()">Connect PM5</button>
    <span id="statusIndicatorPM5" class="statusIndicator" title="PM5 Connection Status"></span>
  </div>

  <h2>Polar Heart Rate BLE Connection</h2>
  <div class="row">
    <button onclick="connectToPolar()">Connect Polar</button>
    <span id="statusIndicatorPolar" class="statusIndicator" title="Polar Connection Status"></span>
    <span id="bpmDisplay" style="font-size:20px; font-weight:bold;">-- bpm</span>
  </div>

  <pre id="id_log"></pre>


<script>
  function parseValue(arrayBuffer)
  {
    const length = arrayBuffer.byteLength;

    if (length === 0) return '[Empty buffer]';

    try {
        const text = new TextDecoder('utf-8').decode(arrayBuffer);
        if (/^[\x20-\x7E\r\n\t]+$/.test(text)) {
        return text.trim();
        }
    } catch (_) {  }

    const typedArrayTypes = [
        { Type: Float32Array, label: 'Float32Array', size: 4 },
        { Type: Uint16Array,  label: 'Uint16Array',  size: 2 },
        { Type: Int16Array,   label: 'Int16Array',   size: 2 },
        { Type: Uint8Array,   label: 'Uint8Array',   size: 1 }
    ];

    for (const { Type, label, size } of typedArrayTypes) {
        if (length % size === 0) {
        try {
            return new Type(arrayBuffer);
        } catch (_) {}
        }
    }

    return `[Unrecognized data format] (length: ${length} bytes)`;
  }

  async function update_notification(event)
  {
      let characteristic = event.target;
      const value = characteristic.value;
      const arrayBuffer = value.buffer;
      console.log( arrayBuffer );

      const result = parseValue(arrayBuffer);
      console.log( result );
      Log( result );
  }

  async function update_text(event)
  {
    const decoder = new TextDecoder('utf-8');
    const value = decoder.decode(event.target.value);
    console.log(`[text_update] '${value}'`);
  }

  async function server_get(server, service_id, characteristic_id, event_func)
  {
    let service = await server.getPrimaryService( service_id );
    let characteristic = await service.getCharacteristic( characteristic_id );

    await characteristic.startNotifications();
    characteristic.addEventListener('characteristicvaluechanged', event_func);
  }
</script>


<script>
  // ---------------------------------------------------------------
  // Concept2 PM5 (proprietary CSAFE-based service)
  // ---------------------------------------------------------------
  const MID_MULTIPLIER = 256;
  const HIGH_MULTIPLIER = MID_MULTIPLIER * 256;

  async function update_uint8(event)  // decoder
  {
    let characteristic = event.target;
    const value = characteristic.value;
    const arrayBuffer = value.buffer;
    const valueArray = new Uint8Array(arrayBuffer);

    const distance = (valueArray[3] + (valueArray[4] * MID_MULTIPLIER) + (valueArray[5] * HIGH_MULTIPLIER)) * 0.1;
    const timeElapsed = (valueArray[0] + (valueArray[1] * MID_MULTIPLIER) + (valueArray[2] * HIGH_MULTIPLIER)) * 0.01;

    let msg = `distance:'${distance}' time:'${timeElapsed}' `;
    console.log(msg);

    Log(msg);
  }

  let pm5Device;
  let pm5Server;

  let getC2UUID = (id) => `ce06${id}-43e5-11e4-916c-0800200c9a66`.toLowerCase();

  let informationService = getC2UUID('0010');
  let serialNumber = getC2UUID('0012');

  let rowingService = getC2UUID('0030');
  let rowingGeneralStatus = getC2UUID('0031');

  let controlService = getC2UUID('0020');

  const pm5Options = {
    filters: [{ services: [getC2UUID('0000')] }],
    optionalServices: [informationService, controlService, rowingService]
  };

  async function connectToPM5()
  {
    try
    {
      Log('Requesting PM5...');

      pm5Device = await navigator.bluetooth.requestDevice(pm5Options);
      pm5Device.addEventListener('gattserverdisconnected', onDisconnectedPM5);

      pm5Server = await pm5Device.gatt.connect();
      updateIndicator('statusIndicatorPM5', true);
      Log(`Connected to PM5: "${pm5Server.device.name}" (${pm5Server.device.id})`);

      const service = await pm5Server.getPrimaryService( rowingService );
      const characteristic = await service.getCharacteristic( rowingGeneralStatus );

      await characteristic.startNotifications();
      characteristic.addEventListener('characteristicvaluechanged', e => {
          update_uint8(e);
      });

    } catch (error) {
      Log('PM5 Error: ' + error.message);
      updateIndicator('statusIndicatorPM5', false);
    }
  }

  function onDisconnectedPM5()
  {
    Log('Disconnected from PM5');
    updateIndicator('statusIndicatorPM5', false);
  }


  // ---------------------------------------------------------------
  // Polar Heart Rate (standard Bluetooth SIG Heart Rate Service)
  // Same 0x180D / 0x2A37 UUIDs used by Amazfit Heart Rate Push
  // and any other BLE HR monitor compliant with the standard.
  // ---------------------------------------------------------------
  const HEART_RATE_SERVICE = 0x180D;
  const HEART_RATE_MEASUREMENT_CHAR = 0x2A37;

  let polarDevice;
  let polarServer;

  const polarOptions = {
    filters: [{ services: [HEART_RATE_SERVICE] }],
    optionalServices: [HEART_RATE_SERVICE]
  };

  // Parses the standard BLE Heart Rate Measurement payload.
  // Flags byte: bit 0 = value format (UINT8/UINT16), bit 3 = Energy
  // Expended present, bit 4 = RR-Interval present.
  function parseHeartRate(dataView)
  {
    const flags = dataView.getUint8(0);
    const rate16Bits = flags & 0x1;
    const energyExpendedPresent = (flags >> 3) & 0x1;
    const rrIntervalPresent = (flags >> 4) & 0x1;

    let index = 1;
    let heartRate;

    if (rate16Bits) {
      heartRate = dataView.getUint16(index, true);
      index += 2;
    } else {
      heartRate = dataView.getUint8(index);
      index += 1;
    }

    if (energyExpendedPresent) {
      index += 2; // skip UINT16 energy expended field
    }

    let rrIntervals = [];
    if (rrIntervalPresent) {
      try {
        while (index + 1 < dataView.byteLength) {
          const rrRaw = dataView.getUint16(index, true);
          rrIntervals.push(Math.round((rrRaw / 1024) * 1000));
          index += 2;
        }
      } catch (err) {
        Log(`Warning: failed to parse RR-Interval data: ${err.message}`);
        rrIntervals = [];
      }
    }

    return { heartRate, rrIntervals };
  }

  function update_polar_hr(event)
  {
    const dataView = event.target.value;

    let parsed;
    try {
      parsed = parseHeartRate(dataView);
    } catch (err) {
      Log('Polar parse error: ' + err.message);
      return;
    }

    const { heartRate, rrIntervals } = parsed;
    document.getElementById('bpmDisplay').textContent = `${heartRate} bpm`;

    const rrText = rrIntervals.length > 0 ? rrIntervals.join(', ') + ' ms' : 'not present';
    Log(`Polar HR: ${heartRate} bpm | RR: ${rrText}`);
  }

  async function connectToPolar()
  {
    try
    {
      Log('Requesting Polar device...');

      polarDevice = await navigator.bluetooth.requestDevice(polarOptions);
      polarDevice.addEventListener('gattserverdisconnected', onDisconnectedPolar);

      polarServer = await polarDevice.gatt.connect();
      updateIndicator('statusIndicatorPolar', true);
      Log(`Connected to Polar device: "${polarServer.device.name}" (${polarServer.device.id})`);

      await server_get(polarServer, HEART_RATE_SERVICE, HEART_RATE_MEASUREMENT_CHAR, update_polar_hr);
      Log('Subscribed to Polar Heart Rate notifications.');

    } catch (error) {
      Log('Polar Error: ' + error.message);
      updateIndicator('statusIndicatorPolar', false);
    }
  }

  function onDisconnectedPolar()
  {
    Log('Disconnected from Polar device');
    updateIndicator('statusIndicatorPolar', false);
    document.getElementById('bpmDisplay').textContent = '-- bpm';
  }


  // ---------------------------------------------------------------
  // Shared helpers
  // ---------------------------------------------------------------
  function updateIndicator(elementId, isConnected)
  {
    const indicator = document.getElementById(elementId);
    indicator.style.backgroundColor = isConnected ? 'blue' : 'red';
  }

  function Log(message)
  {
    const logEl = document.getElementById('id_log');
    logEl.textContent += message + '\n';
  }
</script>

</body>
</html>
