<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Time-Series Data — Normalized Multi-File Plot</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --grid:#2a2f3a; --text:#e6e8eb; --muted:#9aa3af;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:24px; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  h1{font-size:18px; font-weight:600; margin:0 0 4px;}
  p.sub{color:var(--muted); font-size:13px; margin:0 0 16px;}
  #status{color:var(--muted); font-size:13px; margin-bottom:12px; white-space:pre-line;}
  .panel{
    background:var(--panel); border:1px solid var(--grid); border-radius:10px;
    padding:16px; max-width:1100px;
  }
  .controls{display:flex; gap:16px; flex-wrap:wrap; align-items:center; margin-bottom:12px; font-size:13px;}
  .legend-group{border:1px solid var(--grid); border-radius:6px; padding:6px 10px; margin-bottom:8px;}
  .legend-group-title{font-size:12px; color:var(--muted); margin-bottom:4px; display:flex; justify-content:space-between; gap:8px;}
  .legend-items{display:flex; gap:10px; flex-wrap:wrap;}
  .legend-item{display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none; font-size:13px;}
  .swatch{width:12px; height:3px; border-radius:2px; display:inline-block;}
  .legend-item.off{opacity:0.35;}
  input[type=range]{width:220px;}
  input[type=file]{color:var(--text);}
  canvas{width:100%; display:block; background:#0d0f13; border-radius:6px;}
  .row{display:flex; gap:24px; flex-wrap:wrap; align-items:center;}
  #tooltip{
    position:fixed; background:#1e222b; border:1px solid var(--grid); padding:6px 10px;
    border-radius:6px; font-size:12px; pointer-events:none; display:none; white-space:nowrap;
  }
  label{color:var(--muted);}
  button{background:#232833; color:var(--text); border:1px solid var(--grid); border-radius:6px; padding:6px 10px; cursor:pointer;}
  .rm-btn{background:none; border:none; color:var(--muted); cursor:pointer; font-size:12px; padding:0 4px;}
  .rm-btn:hover{color:#ff6b6b;}
</style>
</head>
<body>

<h1>Time-Series Data — Normalized Multi-File Plot</h1>
<p class="sub">Load one or more CSV files (time, col_1, ..., col_N — no header). Each file loaded via "Choose file" is added as an overlay on the same chart.</p>

<div class="row" style="margin-bottom:16px;">
  <input type="file" id="fileInput" accept=".txt,.csv">
  <button id="clearAll">Clear all</button>
</div>
<div id="status">No file loaded.</div>

<div class="panel" id="panel" style="display:none;">
  <div id="legendGroups"></div>
  <div class="row controls">
    <label>Zoom: <input id="zoom" type="range" min="1" max="100" value="100"></label>
    <label>Scroll: <input id="scrollX" type="range" min="0" max="1000" value="0" style="width:400px;"></label>
    <button id="reset">Reset view</button>
  </div>
  <canvas id="chart" width="1000" height="420"></canvas>
</div>
<div id="tooltip"></div>

<script>
/* ---------- reusable, pure/data functions ---------- */

const DASHES  = [[], [6,4], [2,2], [8,3,2,3]]; // one dash pattern per file

function readFileAsText(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (ev) => resolve(ev.target.result);
    reader.onerror = () => reject(new Error('Error reading file: ' + file.name));
    reader.readAsText(file);
  });
}

// Generic CSV parser: first column = time, remaining columns = N series (no header assumed)
function parseCSV(text){
  const lines = text.split('\n').filter(l => l.trim().length > 0);
  if (lines.length === 0) return null;

  const numCols = lines[0].split(',').length;
  const numSeries = numCols - 1;
  if (numSeries < 1) return null;

  const time = new Array(lines.length);
  const rawCols = Array.from({ length: numSeries }, () => new Array(lines.length));

  let n = 0;
  for (let i = 0; i < lines.length; i++){
    const parts = lines[i].split(',');
    if (parts.length < numCols) continue;
    time[n] = parseFloat(parts[0]);
    for (let c = 0; c < numSeries; c++) rawCols[c][n] = parseFloat(parts[c + 1]);
    n++;
  }
  time.length = n;
  rawCols.forEach(col => col.length = n);
  if (n === 0) return null;

  return { time, columns: rawCols };
}

function normalizeArray(arr){
  let min = Infinity, max = -Infinity;
  for (let i = 0; i < arr.length; i++){
    if (arr[i] < min) min = arr[i];
    if (arr[i] > max) max = arr[i];
  }
  const range = (max - min) || 1;
  const out = new Array(arr.length);
  for (let i = 0; i < arr.length; i++) out[i] = 2 * (arr[i] - min) / range - 1;
  return { data: out, min, max };
}

// Linear-interpolated percentile (q in [0,1]) over a sorted ascending array
function quantile(sortedArr, q){
  const pos = (sortedArr.length - 1) * q;
  const lo = Math.floor(pos), hi = Math.ceil(pos);
  if (lo === hi) return sortedArr[lo];
  return sortedArr[lo] + (sortedArr[hi] - sortedArr[lo]) * (pos - lo);
}

// RobustScaler: (x - median) / IQR, IQR = Q3 - Q1
// Visibility bounds use the 2.5-97.5 percentile range instead of Q1-Q3.
function robustScaleArray(arr){
  const sorted = [...arr].sort((a, b) => a - b);
  const median = quantile(sorted, 0.5);
  const q1 = quantile(sorted, 0.25);
  const q3 = quantile(sorted, 0.75);
  const iqr = (q3 - q1) || 1;
  const p1 = quantile(sorted, 0.01);
  const p99 = quantile(sorted, 0.99);
  const data = new Array(arr.length);
  for (let i = 0; i < arr.length; i++) data[i] = (arr[i] - median) / iqr;
  return {
    data, median, q1, q3, iqr,
    lo: (p1 - median) / iqr,
    hi: (p99 - median) / iqr
  };
}

// StandardScaler: (x - mean) / std. Visibility bounds fixed at [-3, 3] std deviations.
function standardScaleArray(arr){
  const n = arr.length;
  let mean = 0;
  for (let i = 0; i < n; i++) mean += arr[i];
  mean /= n;
  let variance = 0;
  for (let i = 0; i < n; i++) variance += (arr[i] - mean) * (arr[i] - mean);
  variance /= n;
  const std = Math.sqrt(variance) || 1;
  const data = new Array(n);
  for (let i = 0; i < n; i++) data[i] = (arr[i] - mean) / std;
  return { data, mean, std, lo: -3, hi: 3 };
}

// Build a dataset object (one per loaded file) from parsed CSV data
// Generates a visually distinct random color (fixed saturation/lightness for readability on dark bg)
function randomColor(){
  const hue = Math.floor(Math.random() * 360);
  return 'hsl(' + hue + ', 75%, 60%)';
}

// module_i = sqrt(col_1_i^2 + col_2_i^2 + ... + col_N_i^2)
function computeModule(rawCols){
  const n = rawCols[0].length;
  const out = new Array(n);
  for (let i = 0; i < n; i++){
    let sumSq = 0;
    for (let c = 0; c < rawCols.length; c++) sumSq += rawCols[c][i] * rawCols[c][i];
    out[i] = Math.sqrt(sumSq);
  }
  return out;
}

function buildDataset(filename, parsed, datasetIndex){
  const hasModule = parsed.columns.length >= 3;
  const columns = parsed.columns.map((raw, i) => ({
    name: 'col_' + (i + 1),
    raw,
    norm: normalizeArray(raw),
    robust: robustScaleArray(raw),
    standard: standardScaleArray(raw),
    color: randomColor(),
    visible: !hasModule // when a module column exists, individual columns start hidden
  }));

  // Prepend a "module" column when there are at least 3 data columns
  if (hasModule){
    const moduleRaw = computeModule(parsed.columns);
    columns.unshift({
      name: 'module',
      raw: moduleRaw,
      norm: normalizeArray(moduleRaw),
      robust: robustScaleArray(moduleRaw),
      standard: standardScaleArray(moduleRaw),
      color: randomColor(),
      visible: true
    });
  }

  return {
    id: 'ds_' + datasetIndex + '_' + Date.now(),
    filename,
    time: parsed.time,
    columns,
    dash: DASHES[datasetIndex % DASHES.length],
    scaleMode: 'standard', // 'norm' Unity | 'raw' Raw | 'robust' Robust | 'standard' Standard
    hidden: false   // true = dataset excluded from the plot
  };
}

// Binary search: first index in sorted ascending arr with value >= target
function lowerBound(arr, target){
  let lo = 0, hi = arr.length;
  while (lo < hi){
    const mid = (lo + hi) >> 1;
    if (arr[mid] < target) lo = mid + 1; else hi = mid;
  }
  return lo;
}

function computeGlobalTimeRange(datasets){
  let min = Infinity, max = -Infinity;
  datasets.forEach(ds => {
    if (ds.time.length === 0) return;
    if (ds.time[0] < min) min = ds.time[0];
    if (ds.time[ds.time.length - 1] > max) max = ds.time[ds.time.length - 1];
  });
  if (min === Infinity){ min = 0; max = 1; }
  return { min, max };
}

/* ---------- app state ---------- */

const statusEl = document.getElementById('status');
const fileInput = document.getElementById('fileInput');
const panel = document.getElementById('panel');
const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');
const zoomSlider = document.getElementById('zoom');
const scrollSlider = document.getElementById('scrollX');
const legendGroupsEl = document.getElementById('legendGroups');

let datasets = [];
let globalRange = { min: 0, max: 1 };
let viewStart = 0, viewEnd = 1;

let cssWidth = 1000;
const cssHeight = 420;
const margin = { top: 20, right: 20, bottom: 30, left: 44 };
let plotW = cssWidth - margin.left - margin.right;
const plotH = cssHeight - margin.top - margin.bottom;
let dpr = 1;

/* ---------- UI wiring ---------- */

fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  fileInput.value = ''; // allow reselecting the same file later
  if (!file) return;

  statusEl.textContent = 'Reading ' + file.name + '…';
  let text;
  try { text = await readFileAsText(file); }
  catch (err){ statusEl.textContent = err.message; return; }

  const parsed = parseCSV(text);
  if (!parsed){
    statusEl.textContent = 'No valid rows parsed from ' + file.name + '.';
    return;
  }

  const ds = buildDataset(file.name, parsed, datasets.length);
  datasets.push(ds);
  onDatasetsChanged();
});

document.getElementById('clearAll').addEventListener('click', () => {
  datasets = [];
  onDatasetsChanged();
});

document.getElementById('reset').addEventListener('click', () => {
  zoomSlider.value = 100; viewCenter = null; updateViewFromZoom(); draw();
});

zoomSlider.addEventListener('input', () => { updateViewFromZoom(); draw(); });
scrollSlider.addEventListener('input', () => { updateViewFromScroll(); draw(); });

canvas.addEventListener('mousemove', onCanvasHover);
canvas.addEventListener('mouseleave', () => tooltip.style.display = 'none');

/* ---------- orchestration ---------- */

function onDatasetsChanged(){
  if (datasets.length === 0){
    panel.style.display = 'none';
    statusEl.textContent = 'No file loaded.';
    legendGroupsEl.innerHTML = '';
    return;
  }
  globalRange = computeGlobalTimeRange(datasets);
  buildLegendGroups();
  updateStatus();
  panel.style.display = 'block';
  setupCanvas();
  zoomSlider.value = 100; viewCenter = null;
  updateViewFromZoom();
  draw();
}

function updateStatus(){
  const lines = datasets.map(ds => {
    const ranges = ds.columns.map(c => c.name + ' [' + c.norm.min + ', ' + c.norm.max + ']').join(' · ');
    return ds.filename + ' — ' + ds.time.length.toLocaleString() + ' samples, time [' +
      ds.time[0].toFixed(2) + ', ' + ds.time[ds.time.length - 1].toFixed(2) + ']s · ' + ranges;
  });
  statusEl.textContent = lines.join('\n');
}

function buildLegendGroups(){
  legendGroupsEl.innerHTML = '';
  datasets.forEach((ds, dsIdx) => {
    const group = document.createElement('div');
    group.className = 'legend-group';

    const title = document.createElement('div');
    title.className = 'legend-group-title';
    title.innerHTML = '<span>' + ds.filename + '</span>';
    const hideBtn = document.createElement('button');
    hideBtn.className = 'rm-btn';
    hideBtn.textContent = ds.hidden ? 'show' : 'hide';
    hideBtn.addEventListener('click', () => {
      ds.hidden = !ds.hidden;
      buildLegendGroups();
      draw();
    });
    title.appendChild(hideBtn);

    const SCALE_LABELS = { norm: 'rescale: Unity', raw: 'rescale: Raw', robust: 'rescale: Robust', standard: 'rescale: Standard' };
    const SCALE_ORDER = ['standard', 'robust', 'raw', 'norm'];
    const rescaleBtn = document.createElement('button');
    rescaleBtn.className = 'rm-btn';
    rescaleBtn.textContent = SCALE_LABELS[ds.scaleMode];
    rescaleBtn.addEventListener('click', () => {
      const nextIdx = (SCALE_ORDER.indexOf(ds.scaleMode) + 1) % SCALE_ORDER.length;
      ds.scaleMode = SCALE_ORDER[nextIdx];
      buildLegendGroups();
      draw();
    });
    title.appendChild(rescaleBtn);

    const rmBtn = document.createElement('button');
    rmBtn.className = 'rm-btn';
    rmBtn.textContent = 'remove';
    rmBtn.addEventListener('click', () => {
      datasets = datasets.filter(d => d.id !== ds.id);
      onDatasetsChanged();
    });
    title.appendChild(rmBtn);
    group.appendChild(title);

    const items = document.createElement('div');
    items.className = 'legend-items';
    ds.columns.forEach(col => {
      const item = document.createElement('div');
      item.className = 'legend-item' + (col.visible ? '' : ' off');
      let rangeTxt = ' [-1, 1]';
      if (ds.scaleMode === 'raw') rangeTxt = ' [' + col.norm.min.toFixed(2) + ', ' + col.norm.max.toFixed(2) + ']';
      else if (ds.scaleMode === 'robust') rangeTxt = ' [' + col.robust.lo.toFixed(2) + ', ' + col.robust.hi.toFixed(2) + ']';
      else if (ds.scaleMode === 'standard') rangeTxt = ' [-3, 3]';
      item.innerHTML = '<span class="swatch" style="background:' + col.color + '"></span>' + col.name + rangeTxt;
      item.addEventListener('click', () => {
        col.visible = !col.visible;
        item.classList.toggle('off', !col.visible);
        draw();
      });
      items.appendChild(item);
    });
    group.appendChild(items);
    legendGroupsEl.appendChild(group);
  });
}

function setupCanvas(){
  dpr = window.devicePixelRatio || 1;
  cssWidth = canvas.clientWidth || canvas.parentElement.clientWidth || 1000;
  plotW = cssWidth - margin.left - margin.right;
  canvas.width = cssWidth * dpr;
  canvas.height = cssHeight * dpr;
  canvas.style.height = cssHeight + 'px';
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(dpr, dpr);
}

window.addEventListener('resize', () => {
  if (datasets.length === 0) return;
  setupCanvas();
  draw();
});

let viewCenter = null; // time value at the center of the current window

function updateViewFromZoom(){
  const totalSpan = globalRange.max - globalRange.min;
  const windowSpan = Math.max(totalSpan * (zoomSlider.value / 100), totalSpan / 10000);
  if (viewCenter === null) viewCenter = globalRange.min + totalSpan / 2;

  let start = viewCenter - windowSpan / 2;
  start = Math.max(globalRange.min, Math.min(start, globalRange.max - windowSpan));
  viewStart = start;
  viewEnd = start + windowSpan;
  viewCenter = viewStart + windowSpan / 2;
  syncScrollSliderToView();
}

function updateViewFromScroll(){
  const totalSpan = globalRange.max - globalRange.min;
  const windowSpan = viewEnd - viewStart;
  const maxStart = Math.max(0, totalSpan - windowSpan);
  const frac = scrollSlider.value / 1000;
  viewStart = globalRange.min + frac * maxStart;
  viewEnd = viewStart + windowSpan;
  viewCenter = viewStart + windowSpan / 2;
}

function syncScrollSliderToView(){
  const totalSpan = globalRange.max - globalRange.min;
  const windowSpan = viewEnd - viewStart;
  const maxStart = Math.max(0, totalSpan - windowSpan);
  const frac = maxStart > 0 ? (viewStart - globalRange.min) / maxStart : 0;
  scrollSlider.value = Math.round(frac * 1000);
}

/* ---------- drawing ---------- */

// Computes the single active Y-axis range: [-1,1] normalized by default,
// or the real combined [min,max] / RobustScaler / StandardScaler range across active columns.
// Priority when mixed: raw > robust > standard > norm (only one shared axis can be shown).
function computeAxisRange(){
  let rawMin = Infinity, rawMax = -Infinity, anyRaw = false;
  let robMin = Infinity, robMax = -Infinity, anyRobust = false;
  let stdMin = Infinity, stdMax = -Infinity, anyStandard = false;

  datasets.forEach(ds => {
    if (ds.hidden) return;

    if (ds.scaleMode === 'raw'){
      ds.columns.forEach(col => {
        if (!col.visible) return;
        anyRaw = true;
        if (col.norm.min < rawMin) rawMin = col.norm.min;
        if (col.norm.max > rawMax) rawMax = col.norm.max;
      });
    } else if (ds.scaleMode === 'robust'){
      // Shared bound for the whole dataset: the module column's P1-P99
      // when present, so every curve is masked by vector magnitude, not its own range.
      const moduleCol = ds.columns.find(c => c.name === 'module');
      const hasVisible = ds.columns.some(c => c.visible);
      if (hasVisible){
        anyRobust = true;
        if (moduleCol){
          if (moduleCol.robust.lo < robMin) robMin = moduleCol.robust.lo;
          if (moduleCol.robust.hi > robMax) robMax = moduleCol.robust.hi;
        } else {
          ds.columns.forEach(col => {
            if (!col.visible) return;
            if (col.robust.lo < robMin) robMin = col.robust.lo;
            if (col.robust.hi > robMax) robMax = col.robust.hi;
          });
        }
      }
    } else if (ds.scaleMode === 'standard'){
      // Same pattern as RobustScaler: shared bound from the module column when present.
      const moduleCol = ds.columns.find(c => c.name === 'module');
      const hasVisible = ds.columns.some(c => c.visible);
      if (hasVisible){
        anyStandard = true;
        const ref = moduleCol || null;
        if (ref){
          if (ref.standard.lo < stdMin) stdMin = ref.standard.lo;
          if (ref.standard.hi > stdMax) stdMax = ref.standard.hi;
        } else {
          if (-3 < stdMin) stdMin = -3;
          if (3 > stdMax) stdMax = 3;
        }
      }
    }
  });

  if (anyRaw) return { mode: 'raw', min: rawMin, max: rawMax };
  if (anyRobust) return { mode: 'robust', min: robMin, max: robMax };
  if (anyStandard) return { mode: 'standard', min: stdMin, max: stdMax };
  return { mode: 'norm', min: -1, max: 1 };
}

// Maps a data point to its normalized [0,1] vertical fraction under the
// currently active axis range (so all scale modes share one axis).
function toAxisFraction(col, i, axisRange){
  if (axisRange.mode === 'norm') return (col.norm.data[i] + 1) / 2;
  if (axisRange.mode === 'robust') return (col.robust.data[i] - axisRange.min) / (axisRange.max - axisRange.min);
  if (axisRange.mode === 'standard') return (col.standard.data[i] - axisRange.min) / (axisRange.max - axisRange.min);
  const raw = col.raw[i];
  return (raw - axisRange.min) / (axisRange.max - axisRange.min);
}

function plotSeries(ds, col, axisRange){
  const startIdx = lowerBound(ds.time, viewStart);
  let endIdx = lowerBound(ds.time, viewEnd);
  endIdx = Math.min(endIdx, ds.time.length - 1);
  if (endIdx <= startIdx) return;

  ctx.save();
  ctx.beginPath();
  ctx.rect(margin.left, margin.top, plotW, plotH);
  ctx.clip(); // clamp out-of-range values at the plot edges instead of hiding points

  ctx.setLineDash(ds.dash);
  ctx.strokeStyle = col.color;
  ctx.lineWidth = 1.3;
  ctx.beginPath();

  const step = Math.max(1, Math.floor((endIdx - startIdx) / plotW));
  let first = true;
  for (let i = startIdx; i <= endIdx; i += step){
    const px = margin.left + ((ds.time[i] - viewStart) / (viewEnd - viewStart)) * plotW;
    const py = margin.top + plotH * (1 - toAxisFraction(col, i, axisRange));
    if (first){ ctx.moveTo(px, py); first = false; }
    else ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function draw(){
  ctx.clearRect(0, 0, cssWidth, cssHeight);
  ctx.strokeStyle = '#2a2f3a';
  ctx.lineWidth = 1;
  ctx.fillStyle = '#9aa3af';
  ctx.font = '11px sans-serif';

  const axisRange = computeAxisRange();
  [0, 0.25, 0.5, 0.75, 1].forEach(f => {
    const yPix = margin.top + plotH * (1 - f);
    const value = axisRange.min + f * (axisRange.max - axisRange.min);
    ctx.beginPath();
    ctx.moveTo(margin.left, yPix);
    ctx.lineTo(margin.left + plotW, yPix);
    ctx.stroke();
    ctx.fillText(axisRange.mode === 'raw' ? value.toFixed(0) : value.toFixed(2), 4, yPix + 3);
  });

  ctx.fillText(viewStart.toFixed(2) + 's', margin.left, cssHeight - 8);
  ctx.fillText(viewEnd.toFixed(2) + 's', margin.left + plotW - 40, cssHeight - 8);

  datasets.forEach(ds => {
    if (ds.hidden) return;
    ds.columns.forEach(col => { if (col.visible) plotSeries(ds, col, axisRange); });
  });
}

/* ---------- tooltip ---------- */

function onCanvasHover(e){
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  if (mx < margin.left || mx > margin.left + plotW || datasets.length === 0){
    tooltip.style.display = 'none';
    return;
  }
  const t = viewStart + ((mx - margin.left) / plotW) * (viewEnd - viewStart);

  let html = 't=' + t.toFixed(3) + 's<br>';
  datasets.forEach(ds => {
    if (ds.hidden) return;
    const idx = Math.min(lowerBound(ds.time, t), ds.time.length - 1);
    if (idx < 0) return;
    html += '<b>' + ds.filename + '</b><br>';
    ds.columns.forEach(col => {
      if (ds.scaleMode === 'raw'){
        html += '&nbsp;&nbsp;' + col.name + ': ' + col.raw[idx] + ' (norm ' + col.norm.data[idx].toFixed(3) + ')<br>';
      } else if (ds.scaleMode === 'robust'){
        const outOfRange = (col.robust.data[idx] < col.robust.lo || col.robust.data[idx] > col.robust.hi);
        const inIqr = outOfRange ? ' (clipped, outside P1-P99)' : '';
        html += '&nbsp;&nbsp;' + col.name + ': ' + col.robust.data[idx].toFixed(3) + ' (raw ' + col.raw[idx] + ')' + inIqr + '<br>';
      } else if (ds.scaleMode === 'standard'){
        const outOfRange = (col.standard.data[idx] < -3 || col.standard.data[idx] > 3);
        const clipTxt = outOfRange ? ' (clipped, outside ±3σ)' : '';
        html += '&nbsp;&nbsp;' + col.name + ': ' + col.standard.data[idx].toFixed(3) + ' (raw ' + col.raw[idx] + ')' + clipTxt + '<br>';
      } else {
        html += '&nbsp;&nbsp;' + col.name + ': ' + col.norm.data[idx].toFixed(3) + ' (raw ' + col.raw[idx] + ')<br>';
      }
    });
  });

  tooltip.style.display = 'block';
  tooltip.style.left = (e.clientX + 12) + 'px';
  tooltip.style.top = (e.clientY + 12) + 'px';
  tooltip.innerHTML = html;
}
</script>

</body>
</html>
